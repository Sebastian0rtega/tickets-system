name: Test VM Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔐 Test SSH Connection
      run: |
        echo "🔧 Configurando SSH..."
        
        # 1. Guardar clave
        echo "${{ secrets.VM_SSH_KEY }}" > key
        chmod 600 key
        
        echo "✅ Clave guardada"
        echo "📡 Conectando a: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ secrets.VM_SSH_PORT }}"
        
        # 2. Test básico
        ssh -o StrictHostKeyChecking=no \
            -p "${{ secrets.VM_SSH_PORT }}" \
            -i key \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "echo '✅ Conectado a VM' && whoami && hostname && pwd"
        
        # 3. Crear archivo
        ssh -o StrictHostKeyChecking=no \
            -p "${{ secrets.VM_SSH_PORT }}" \
            -i key \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "echo 'prueba' > ~/index.html && echo '📁 Archivo creado: ~/index.html' && cat ~/index.html"
        
        echo "🎉 ¡Todo funcionó correctamente!"