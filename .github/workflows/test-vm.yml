name: Test VM Connection

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Test SSH Connection
        shell: bash
        run: |
          echo "🔧 Configurando SSH..."

          # Guardar clave privada
          echo "${{ secrets.VM_SSH_KEY }}" > key
          chmod 600 key

          echo "✅ Clave guardada"
          echo "📡 Conectando a: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ secrets.VM_SSH_PORT }}"

          # Test conexión
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p "${{ secrets.VM_SSH_PORT }}" \
              -i key \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
              "echo '✅ Conectado a VM linux'; whoami; hostname; pwd"

          # Crear archivo de prueba
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p "${{ secrets.VM_SSH_PORT }}" \
              -i key \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
              "echo 'prueba' > ~/index.html && echo '📁 Archivo creado' && cat ~/index.html"

          echo "🎉 ¡Todo funcionó correctamente!"
